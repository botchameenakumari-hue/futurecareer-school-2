<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070C17"/>
      <stop offset="1" stop-color="#101A31"/>
    </linearGradient>
    <linearGradient id="gold" x1="72" y1="114" x2="812" y2="114" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E5B84A"/>
      <stop offset="1" stop-color="#F5D98C"/>
    </linearGradient>
    <filter id="blurA" x="-140" y="-140" width="560" height="560" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="56"/>
    </filter>
    <filter id="blurB" x="820" y="-100" width="420" height="420" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="44"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <g filter="url(#blurA)" opacity="0.2">
    <circle cx="150" cy="110" r="120" fill="#E5B84A"/>
  </g>
  <g filter="url(#blurB)" opacity="0.16">
    <circle cx="1040" cy="110" r="90" fill="#2DD4BF"/>
  </g>

  <g opacity="0.34">
    <path d="M0 88H1200" stroke="white" stroke-opacity="0.15"/>
    <path d="M0 178H1200" stroke="white" stroke-opacity="0.1"/>
    <path d="M0 268H1200" stroke="white" stroke-opacity="0.08"/>
    <path d="M0 358H1200" stroke="white" stroke-opacity="0.08"/>
    <path d="M0 448H1200" stroke="white" stroke-opacity="0.06"/>
    <path d="M0 538H1200" stroke="white" stroke-opacity="0.05"/>
  </g>

  <text x="72" y="72" fill="white" fill-opacity="0.62" font-family="Arial, sans-serif" font-size="20" font-weight="700">
    HOW TO CHOOSE A CAREER AFTER 12TH
  </text>
  <text x="72" y="118" fill="url(#gold)" font-family="Arial, sans-serif" font-size="48" font-weight="800">
    DECISION SCORECARD
  </text>
  <text x="72" y="154" fill="white" fill-opacity="0.68" font-family="Arial, sans-serif" font-size="20">
    Score the path before fees, loans, and years go in.
  </text>

  <g transform="translate(72 210)">
    <rect width="500" height="174" rx="18" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.16"/>
    <rect x="24" y="22" width="48" height="48" rx="12" fill="#2DD4BF"/>
    <text x="48" y="53" text-anchor="middle" fill="#071425" font-family="Arial, sans-serif" font-size="24" font-weight="800">1</text>
    <text x="92" y="54" fill="white" font-family="Arial, sans-serif" font-size="30" font-weight="800">Biology</text>
    <text x="24" y="96" fill="white" fill-opacity="0.84" font-family="Arial, sans-serif" font-size="21">- Does the daily work suit your energy?</text>
    <text x="24" y="126" fill="white" fill-opacity="0.84" font-family="Arial, sans-serif" font-size="21">- Remote, office, field, or hybrid fit?</text>
    <text x="24" y="156" fill="white" fill-opacity="0.84" font-family="Arial, sans-serif" font-size="21">- Can you stay consistent doing this?</text>
  </g>

  <g transform="translate(628 210)">
    <rect width="500" height="174" rx="18" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.16"/>
    <rect x="24" y="22" width="48" height="48" rx="12" fill="#E5B84A"/>
    <text x="48" y="53" text-anchor="middle" fill="#161107" font-family="Arial, sans-serif" font-size="24" font-weight="800">2</text>
    <text x="92" y="54" fill="white" font-family="Arial, sans-serif" font-size="30" font-weight="800">Context</text>
    <text x="24" y="96" fill="white" fill-opacity="0.84" font-family="Arial, sans-serif" font-size="21">- Is the cost safe for your family?</text>
    <text x="24" y="126" fill="white" fill-opacity="0.84" font-family="Arial, sans-serif" font-size="21">- Do you need income early?</text>
    <text x="24" y="156" fill="white" fill-opacity="0.84" font-family="Arial, sans-serif" font-size="21">- Can your time and stress budget handle it?</text>
  </g>

  <g transform="translate(72 412)">
    <rect width="500" height="174" rx="18" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.16"/>
    <rect x="24" y="22" width="48" height="48" rx="12" fill="#2DD4BF"/>
    <text x="48" y="53" text-anchor="middle" fill="#071425" font-family="Arial, sans-serif" font-size="24" font-weight="800">3</text>
    <text x="92" y="54" fill="white" font-family="Arial, sans-serif" font-size="30" font-weight="800">Market</text>
    <text x="24" y="96" fill="white" fill-opacity="0.84" font-family="Arial, sans-serif" font-size="21">- Do real people pay for this work now?</text>
    <text x="24" y="126" fill="white" fill-opacity="0.84" font-family="Arial, sans-serif" font-size="21">- Are roles, gigs, or apprenticeships visible?</text>
    <text x="24" y="156" fill="white" fill-opacity="0.84" font-family="Arial, sans-serif" font-size="21">- Can you show proof in 30 to 90 days?</text>
  </g>

  <g transform="translate(628 412)">
    <rect width="500" height="174" rx="18" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.16"/>
    <rect x="24" y="22" width="48" height="48" rx="12" fill="#E5B84A"/>
    <text x="48" y="53" text-anchor="middle" fill="#161107" font-family="Arial, sans-serif" font-size="24" font-weight="800">4</text>
    <text x="92" y="54" fill="white" font-family="Arial, sans-serif" font-size="30" font-weight="800">Survival</text>
    <text x="24" y="96" fill="white" fill-opacity="0.84" font-family="Arial, sans-serif" font-size="21">- Can AI replace this fully, or only parts?</text>
    <text x="24" y="126" fill="white" fill-opacity="0.84" font-family="Arial, sans-serif" font-size="21">- Can you learn the tools that strengthen it?</text>
    <text x="24" y="156" fill="white" fill-opacity="0.84" font-family="Arial, sans-serif" font-size="21">- Will this still matter in the future?</text>
  </g>

  <text x="72" y="638" fill="white" fill-opacity="0.54" font-family="Arial, sans-serif" font-size="18">
    Future Career School - choose with a scorecard, not pressure
  </text>
</svg>
