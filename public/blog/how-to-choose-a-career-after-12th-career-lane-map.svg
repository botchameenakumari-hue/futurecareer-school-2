    <text x="24" y="168" fill="white" fill-opacity="0.84" font-family="Arial, sans-serif" font-size="20">- Degree plus modern digital tools</text>
    <text x="24" y="198" fill="white" fill-opacity="0.84" font-family="Arial, sans-serif" font-size="20">- Engineering plus cloud or AI</text>
    <text x="24" y="228" fill="white" fill-opacity="0.84" font-family="Arial, sans-serif" font-size="20">- Commerce plus analytics</text>
