    <text x="160" y="124" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="30" font-weight="800">Lane</text>
    <text x="24" y="166" fill="white" fill-opacity="0.84" font-family="Arial, sans-serif" font-size="20">- Medicine, law, licensed paths</text>
    <text x="24" y="196" fill="white" fill-opacity="0.84" font-family="Arial, sans-serif" font-size="20">- Degree and exams matter more</text>
    <text x="24" y="226" fill="white" fill-opacity="0.84" font-family="Arial, sans-serif" font-size="20">- Affordability still matters a lot</text>
