<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760"><rect width="1600" height="760" rx="36" fill="#080c18"/><g font-family="Arial,sans-serif"><text x="100" y="105" fill="#f5d98c" font-size="42" font-weight="700">An assessment is a starting signal, not a verdict</text><text x="100" y="150" fill="#9ca8bd" font-size="24">Use the result to ask better questions, then test the direction against real work.</text><g fill="#111a2d" stroke="#e5b84a" stroke-width="3"><circle cx="230" cy="350" r="115"/><circle cx="560" cy="350" r="115"/><circle cx="890" cy="350" r="115"/><circle cx="1220" cy="350" r="115"/></g><g fill="#fff" font-size="27" font-weight="700" text-anchor="middle"><text x="230" y="345">Signal</text><text x="560" y="345">Question</text><text x="890" y="345">Experiment</text><text x="1220" y="345">Direction</text></g><g fill="#9ca8bd" font-size="19" text-anchor="middle"><text x="230" y="385">patterns in how</text><text x="230" y="412">you think and work</text><text x="560" y="385">what does this</text><text x="560" y="412">mean for you?</text><text x="890" y="385">try a small piece</text><text x="890" y="412">of the actual work</text><text x="1220" y="385">choose the next</text><text x="1220" y="412">testable step</text></g><path d="M345 350H445M675 350H775M1005 350H1105" stroke="#2dd4bf" stroke-width="8" stroke-linecap="round"/><rect x="460" y="580" width="680" height="74" rx="37" fill="#e5b84a"/><text x="800" y="628" fill="#080c18" font-size="27" text-anchor="middle" font-weight="700">Insight becomes useful when it changes what you do next.</text></g></svg>
