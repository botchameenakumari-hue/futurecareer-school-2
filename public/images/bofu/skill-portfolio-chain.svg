<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">The skill portfolio chain</title>
  <desc id="desc">A chain from strengths to proof, paid work, and financial freedom.</desc>
  <rect width="1600" height="720" rx="36" fill="#080c18"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="800" y="110" fill="#f5d98c" font-size="38" font-weight="700">Build leverage one proof point at a time</text>
    <g fill="#111a2d" stroke="#2dd4bf" stroke-width="3">
      <rect x="90" y="260" width="250" height="150" rx="24"/><rect x="390" y="260" width="250" height="150" rx="24"/><rect x="690" y="260" width="250" height="150" rx="24"/><rect x="990" y="260" width="250" height="150" rx="24"/><rect x="1290" y="260" width="220" height="150" rx="24"/>
    </g>
    <g fill="#fff" font-size="26" font-weight="700"><text x="215" y="325">Strengths</text><text x="515" y="325">Skill</text><text x="815" y="325">Proof</text><text x="1115" y="325">Paid work</text><text x="1400" y="325">Freedom</text></g>
    <g fill="#9ca8bd" font-size="19"><text x="215" y="365">what comes naturally</text><text x="515" y="365">what compounds</text><text x="815" y="365">what others can see</text><text x="1115" y="365">what the market buys</text><text x="1400" y="365">more choice, sooner</text></g>
    <path d="M340 335H390M640 335H690M940 335H990M1240 335H1290" stroke="#e5b84a" stroke-width="8" stroke-linecap="round"/>
    <text x="800" y="585" fill="#9ca8bd" font-size="22">The work is not choosing a course. It is stacking useful, visible capability.</text>
  </g>
</svg>
