<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760"><rect width="1600" height="760" rx="36" fill="#080c18"/><g font-family="Arial,sans-serif"><text x="100" y="105" fill="#f5d98c" font-size="42" font-weight="700">A better career decision looks at the whole picture</text><text x="100" y="150" fill="#9ca8bd" font-size="24">Not just a course name. Not just a college brand. The fit, the market, and the person all matter.</text><g fill="#111a2d" stroke="#e5b84a" stroke-width="3"><rect x="100" y="235" width="250" height="180" rx="24"/><rect x="390" y="235" width="250" height="180" rx="24"/><rect x="680" y="235" width="250" height="180" rx="24"/><rect x="970" y="235" width="250" height="180" rx="24"/><rect x="1260" y="235" width="240" height="180" rx="24"/></g><g fill="#fff" font-size="27" font-weight="700" text-anchor="middle"><text x="225" y="300">Person</text><text x="515" y="300">Options</text><text x="805" y="300">Market</text><text x="1095" y="300">Skills</text><text x="1380" y="300">Money</text></g><g fill="#9ca8bd" font-size="19" text-anchor="middle"><text x="225" y="345">strengths, values,</text><text x="225" y="372">constraints, energy</text><text x="515" y="345">routes, degrees,</text><text x="515" y="372">roles, trade-offs</text><text x="805" y="345">demand, proof,</text><text x="805" y="372">income ceiling</text><text x="1095" y="345">what compounds</text><text x="1095" y="372">and travels</text><text x="1380" y="345">runway, risk,</text><text x="1380" y="372">financial freedom</text></g><path d="M350 325H390M640 325H680M930 325H970M1220 325H1260" stroke="#2dd4bf" stroke-width="8" stroke-linecap="round"/><rect x="350" y="530" width="900" height="100" rx="50" fill="#e5b84a"/><text x="800" y="592" fill="#080c18" font-size="30" font-weight="700" text-anchor="middle">Clearer direction + stronger skill portfolio + better odds</text></g></svg>
