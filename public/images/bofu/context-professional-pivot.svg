<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760"><rect width="1600" height="760" rx="36" fill="#080c18"/><g font-family="Arial,sans-serif"><text x="100" y="105" fill="#f5d98c" font-size="42" font-weight="700">For working professionals: make the next move deliberate</text><text x="100" y="150" fill="#9ca8bd" font-size="24">A pivot is stronger when it protects your runway and increases your future options.</text><g fill="#111a2d" stroke="#2dd4bf" stroke-width="3"><rect x="110" y="250" width="300" height="190" rx="24"/><rect x="470" y="250" width="300" height="190" rx="24"/><rect x="830" y="250" width="300" height="190" rx="24"/><rect x="1190" y="250" width="300" height="190" rx="24"/></g><g fill="#fff" font-size="28" font-weight="700" text-anchor="middle"><text x="260" y="320">Reality</text><text x="620" y="320">Transfer</text><text x="980" y="320">Rebuild</text><text x="1340" y="320">Leverage</text></g><g fill="#9ca8bd" font-size="20" text-anchor="middle"><text x="260" y="370">runway, role,</text><text x="260" y="398">constraints</text><text x="620" y="370">strengths that</text><text x="620" y="398">travel with you</text><text x="980" y="370">new capability</text><text x="980" y="398">and proof</text><text x="1340" y="370">better options,</text><text x="1340" y="398">not just a new title</text></g><path d="M410 345H470M770 345H830M1130 345H1190" stroke="#e5b84a" stroke-width="8" stroke-linecap="round"/><text x="800" y="610" fill="#f5d98c" font-size="30" text-anchor="middle" font-weight="700">Career change is capability design plus financial reality.</text></g></svg>
