<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760"><rect width="1600" height="760" rx="36" fill="#080c18"/><g font-family="Arial,sans-serif"><text x="100" y="105" fill="#f5d98c" font-size="42" font-weight="700">For students and parents: choose a direction, not a label</text><text x="100" y="150" fill="#9ca8bd" font-size="24">The strongest route connects the learner’s reality to work they can grow into.</text><g fill="#111a2d" stroke="#2dd4bf" stroke-width="3"><rect x="120" y="245" width="280" height="190" rx="24"/><rect x="470" y="245" width="280" height="190" rx="24"/><rect x="820" y="245" width="280" height="190" rx="24"/><rect x="1170" y="245" width="280" height="190" rx="24"/></g><g fill="#fff" font-size="28" font-weight="700" text-anchor="middle"><text x="260" y="315">Notice</text><text x="610" y="315">Compare</text><text x="960" y="315">Test</text><text x="1310" y="315">Build</text></g><g fill="#9ca8bd" font-size="20" text-anchor="middle"><text x="260" y="365">interests, marks,</text><text x="260" y="393">energy, constraints</text><text x="610" y="365">streams, courses,</text><text x="610" y="393">careers, trade-offs</text><text x="960" y="365">small projects,</text><text x="960" y="393">real work signals</text><text x="1310" y="365">skills, proof,</text><text x="1310" y="393">next milestones</text></g><path d="M400 340H470M750 340H820M1100 340H1170" stroke="#e5b84a" stroke-width="8" stroke-linecap="round"/><text x="800" y="580" fill="#f5d98c" font-size="30" text-anchor="middle" font-weight="700">A good decision reduces confusion without pretending the future is certain.</text></g></svg>
