<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760"><rect width="1600" height="760" rx="36" fill="#080c18"/><g font-family="Arial,sans-serif"><text x="100" y="105" fill="#f5d98c" font-size="42" font-weight="700">For graduates: turn education into visible leverage</text><text x="100" y="150" fill="#9ca8bd" font-size="24">A degree opens a door. A portfolio shows what you can contribute once you are inside.</text><path d="M180 370C420 200 590 540 820 350S1210 210 1420 370" fill="none" stroke="#2dd4bf" stroke-width="10" stroke-linecap="round"/><g fill="#111a2d" stroke="#e5b84a" stroke-width="3"><circle cx="180" cy="370" r="92"/><circle cx="500" cy="365" r="92"/><circle cx="820" cy="350" r="92"/><circle cx="1120" cy="325" r="92"/><circle cx="1420" cy="370" r="92"/></g><g fill="#fff" font-size="25" font-weight="700" text-anchor="middle"><text x="180" y="365">Degree</text><text x="500" y="360">Gap</text><text x="820" y="345">Skill</text><text x="1120" y="320">Proof</text><text x="1420" y="365">Opportunity</text></g><g fill="#9ca8bd" font-size="19" text-anchor="middle"><text x="180" y="405">starting point</text><text x="500" y="400">what is missing?</text><text x="820" y="385">what compounds?</text><text x="1120" y="360">what can others see?</text><text x="1420" y="405">what gets bought?</text></g><text x="800" y="620" fill="#f5d98c" font-size="30" text-anchor="middle" font-weight="700">Move from “I have studied” to “Here is what I can do.”</text></g></svg>
