<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760"><rect width="1600" height="760" rx="36" fill="#080c18"/><g font-family="Arial,sans-serif"><text x="100" y="105" fill="#f5d98c" font-size="42" font-weight="700">After 12th: compare the work before the course</text><text x="100" y="150" fill="#9ca8bd" font-size="24">Science, Commerce, Arts, diploma, and skill-first routes can all be valid — if they fit the destination.</text><g fill="#111a2d" stroke="#e5b84a" stroke-width="3"><rect x="110" y="240" width="300" height="210" rx="24"/><rect x="470" y="240" width="300" height="210" rx="24"/><rect x="830" y="240" width="300" height="210" rx="24"/><rect x="1190" y="240" width="300" height="210" rx="24"/></g><g fill="#fff" font-size="28" font-weight="700" text-anchor="middle"><text x="260" y="315">Destination</text><text x="620" y="315">Route</text><text x="980" y="315">Capability</text><text x="1340" y="315">Evidence</text></g><g fill="#9ca8bd" font-size="20" text-anchor="middle"><text x="260" y="370">what kind of work</text><text x="260" y="398">could fit?</text><text x="620" y="370">degree, diploma,</text><text x="620" y="398">or skill-first?</text><text x="980" y="370">what must you be</text><text x="980" y="398">able to do?</text><text x="1340" y="370">how will you show</text><text x="1340" y="398">you can do it?</text></g><path d="M410 345H470M770 345H830M1130 345H1190" stroke="#2dd4bf" stroke-width="8" stroke-linecap="round"/><rect x="420" y="570" width="760" height="74" rx="37" fill="#2dd4bf"/><text x="800" y="618" fill="#080c18" font-size="27" text-anchor="middle" font-weight="700">The course is a tool. The capability is the asset.</text></g></svg>
