<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">A practical career guidance session flow</title>
  <desc id="desc">Five connected stages from context to a skill portfolio and review.</desc>
  <rect width="1600" height="720" rx="36" fill="#080c18"/>
  <path d="M170 360H1430" stroke="#2dd4bf" stroke-width="8" stroke-linecap="round" opacity=".55"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#111a2d" stroke="#e5b84a" stroke-width="3">
      <circle cx="190" cy="360" r="100"/><circle cx="495" cy="360" r="100"/><circle cx="800" cy="360" r="100"/><circle cx="1105" cy="360" r="100"/><circle cx="1410" cy="360" r="100"/>
    </g>
    <g fill="#f5d98c" font-size="24" font-weight="700"><text x="190" y="350">01</text><text x="495" y="350">02</text><text x="800" y="350">03</text><text x="1105" y="350">04</text><text x="1410" y="350">05</text></g>
    <g fill="#fff" font-size="26"><text x="190" y="405">Context</text><text x="495" y="405">Clarity</text><text x="800" y="405">Options</text><text x="1105" y="405">Skill plan</text><text x="1410" y="405">Review</text></g>
    <text x="800" y="110" fill="#f5d98c" font-size="38" font-weight="700">How guidance becomes a next step</text>
    <text x="800" y="625" fill="#9ca8bd" font-size="22">A conversation, a decision filter, and a plan that can be tested in real life.</text>
  </g>
</svg>
