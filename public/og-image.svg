<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Future Career School</title>
  <desc id="desc">Career clarity, skill direction, and income growth for students and professionals in India.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060a14" />
      <stop offset="100%" stop-color="#0d1424" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5d98c" />
      <stop offset="50%" stop-color="#e5b84a" />
      <stop offset="100%" stop-color="#c49a2a" />
    </linearGradient>
    <radialGradient id="orbGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e5b84a" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#e5b84a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect x="36" y="36" width="1128" height="558" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.08" />

  <circle cx="1010" cy="145" r="180" fill="url(#orbGold)" />
  <circle cx="210" cy="520" r="220" fill="url(#orbTeal)" />

  <path d="M0 488C190 430 378 426 564 478C756 532 932 532 1200 440V630H0Z" fill="#ffffff" fill-opacity="0.03" />
  <path d="M0 520C202 462 404 462 612 520C804 572 986 570 1200 498" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2" />

  <g transform="translate(96 112)">
    <rect x="0" y="0" width="210" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.10" />
    <circle cx="26" cy="20" r="6" fill="#2dd4bf" />
    <text x="44" y="26" fill="#d7dde8" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="1">FUTURE CAREER SCHOOL</text>

    <text x="0" y="126" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700">Career clarity,</text>
    <text x="0" y="208" fill="url(#gold)" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700">skill direction,</text>
    <text x="0" y="290" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700">income growth.</text>

    <text x="0" y="360" fill="#c0cad8" font-family="Arial, Helvetica, sans-serif" font-size="28">Strategy-first career guidance for students, graduates,</text>
    <text x="0" y="398" fill="#c0cad8" font-family="Arial, Helvetica, sans-serif" font-size="28">and professionals across India.</text>

    <rect x="0" y="448" width="270" height="54" rx="14" fill="url(#gold)" />
    <text x="28" y="482" fill="#080c18" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">futurecareerschool.com</text>
  </g>
